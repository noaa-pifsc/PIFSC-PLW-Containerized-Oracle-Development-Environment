services:
  code-db-ords-deploy:
    secrets:
      - piclib_db_username_secret
      - piclib_db_password_secret
      - plw_db_username_secret
      - plw_db_password_secret
secrets:
  piclib_db_username_secret:
    name: ${COMPOSE_PROJECT_NAME}_piclib_db_username_secret
    external: true
  piclib_db_password_secret:
    name: ${COMPOSE_PROJECT_NAME}_piclib_db_password_secret
    external: true
  plw_db_username_secret:
    name: ${COMPOSE_PROJECT_NAME}_plw_db_username_secret
    external: true
  plw_db_password_secret:
    name: ${COMPOSE_PROJECT_NAME}_plw_db_password_secret
    external: true